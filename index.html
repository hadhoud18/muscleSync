<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<title>MuscleSync — Build Muscle. Lose Fat. Stay on Schedule.</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ============ TOASTS ============ -->
<div id="toastHost" class="toast-host" aria-live="polite"></div>

<!-- ============ AUTH SCREEN ============ -->
<section id="screen-auth" class="screen screen-auth">
  <div class="auth-wrap">
    <div class="auth-brand">
      <div class="brand-mark">MS</div>
      <h1 class="brand-name">MuscleSync</h1>
      <p class="brand-tag">Build Muscle. Lose Fat. Stay on Schedule.</p>
    </div>

    <div class="auth-card" id="loginCard">
      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Log in</button>
        <button class="auth-tab" data-tab="signup">Create account</button>
      </div>

      <form id="loginForm" class="auth-form">
        <label class="field">
          <span>Username</span>
          <input type="text" id="loginUsername" autocomplete="username" placeholder="admin" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="loginPassword" autocomplete="current-password" placeholder="••••••" required>
        </label>
        <p class="field-hint">Demo account: <strong>admin</strong> / <strong>admin</strong></p>
        <button type="submit" class="btn btn-primary btn-block">Log in</button>
      </form>

      <form id="signupForm" class="auth-form hidden">
        <label class="field">
          <span>Choose a username</span>
          <input type="text" id="signupUsername" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Choose a password</span>
          <input type="password" id="signupPassword" autocomplete="new-password" required>
        </label>
        <button type="submit" class="btn btn-primary btn-block">Create account</button>
      </form>

      <p class="auth-disclaimer">This is a local demo. Accounts and passwords are stored in your browser only and are not secure — this is not production authentication.</p>
    </div>
  </div>
</section>

<!-- ============ ONBOARDING ============ -->
<section id="screen-onboarding" class="screen hidden">
  <div class="onb-shell">
    <div class="onb-top">
      <div class="onb-progress"><div class="onb-progress-fill" id="onbProgressFill"></div></div>
      <div class="onb-step-label" id="onbStepLabel">Step 1 of 8</div>
    </div>
    <div class="onb-body" id="onbBody"><!-- injected step content --></div>
    <div class="onb-nav">
      <button class="btn btn-ghost" id="onbBack">Back</button>
      <button class="btn btn-primary" id="onbNext">Continue</button>
    </div>
  </div>
</section>

<!-- ============ APP SHELL ============ -->
<section id="screen-app" class="screen hidden">

  <header class="app-header">
    <div class="app-header-left">
      <div class="brand-mark small">MS</div>
      <div>
        <div class="app-header-title" id="pageTitle">Home</div>
        <div class="app-header-sub" id="pageSubtitle">—</div>
      </div>
    </div>
    <button class="icon-btn" id="logoutBtn" title="Log out" aria-label="Log out">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </button>
  </header>

  <main class="app-main" id="appMain">

    <!-- ---------- HOME ---------- -->
    <div class="page" id="page-home" data-page="home">
      <div id="homeContent"><!-- injected --></div>
    </div>

    <!-- ---------- MY WEEK ---------- -->
    <div class="page hidden" id="page-week" data-page="week">
      <div id="weekContent"><!-- injected --></div>
    </div>

    <!-- ---------- WORKOUT ---------- -->
    <div class="page hidden" id="page-workout" data-page="workout">
      <div id="workoutContent"><!-- injected --></div>
    </div>

    <!-- ---------- NUTRITION ---------- -->
    <div class="page hidden" id="page-nutrition" data-page="nutrition">
      <div id="nutritionContent"><!-- injected --></div>
    </div>

    <!-- ---------- PROGRESS ---------- -->
    <div class="page hidden" id="page-progress" data-page="progress">
      <div id="progressContent"><!-- injected --></div>
    </div>

    <!-- ---------- PROFILE ---------- -->
    <div class="page hidden" id="page-profile" data-page="profile">
      <div id="profileContent"><!-- injected --></div>
    </div>

    <!-- ---------- ADMIN ---------- -->
    <div class="page hidden" id="page-admin" data-page="admin">
      <div id="adminContent"><!-- injected --></div>
    </div>

  </main>

  <nav class="bottom-nav" id="bottomNav">
    <button class="nav-btn active" data-page="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-page="week">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><line x1="3" y1="9" x2="21" y2="9"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="16" y1="2" x2="16" y2="6"/></svg>
      <span>My Week</span>
    </button>
    <button class="nav-btn" data-page="workout">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 6.5 3 3M17.5 17.5 21 21M14 10 10 14M3 21l4-4M17.5 6.5 21 3M2.5 8 8 2.5l3 3L8 8.5 5.5 11 2.5 8ZM16 15.5l5.5-5.5-3-3L13 12.5l3 3Z"/></svg>
      <span>Workout</span>
    </button>
    <button class="nav-btn" data-page="nutrition">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 2a7 7 0 0 0-7 7c0 3 2 5 2 8a3 3 0 0 0 3 3h4a3 3 0 0 0 3-3c0-3 2-5 2-8a7 7 0 0 0-7-7Z"/><path d="M11 2v6"/></svg>
      <span>Nutrition</span>
    </button>
    <button class="nav-btn" data-page="progress">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 6"/><polyline points="14 6 21 6 21 13"/></svg>
      <span>Progress</span>
    </button>
    <button class="nav-btn" data-page="profile">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4.5 5-6 8-6s6.5 1.5 8 6"/></svg>
      <span>Profile</span>
    </button>
  </nav>
</section>

<!-- ============ MODAL HOST ============ -->
<div id="modalHost" class="modal-host hidden">
  <div class="modal-backdrop" id="modalBackdrop"></div>
  <div class="modal-sheet" id="modalSheet" role="dialog" aria-modal="true">
    <div class="modal-grabber"></div>
    <div class="modal-inner" id="modalInner"><!-- injected --></div>
  </div>
</div>

<!-- ============ PLAN GENERATION OVERLAY ============ -->
<div id="genOverlay" class="gen-overlay hidden">
  <div class="gen-box">
    <div class="gen-spinner"></div>
    <div class="gen-line" id="genLine">Analyzing your schedule…</div>
    <div class="gen-progress"><div class="gen-progress-fill" id="genProgressFill"></div></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
